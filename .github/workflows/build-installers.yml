name: Build installers

# Builds User for every desktop platform:
#   Windows  -> .exe (NSIS) and .msi installers
#   macOS    -> one Universal .dmg (Apple Silicon + Intel)
#   Linux    -> .AppImage for x86_64 and arm64 (runs on almost any distro)
#
# - Pull requests and manual runs upload the installers as workflow artifacts.
# - Pushing a tag like v2.1.0 also attaches them to a draft GitHub Release.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    tags: ['v*']

concurrency:
  group: build-installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            args: --bundles nsis,msi
            bundle: src-tauri/target/release/bundle
            files: |
              nsis/*.exe
              msi/*.msi
          - name: macos-universal
            os: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
            bundle: src-tauri/target/universal-apple-darwin/release/bundle
            files: |
              dmg/*.dmg
          - name: linux-x86_64
            os: ubuntu-22.04 # older glibc = AppImage runs on more distros
            args: --bundles appimage
            bundle: src-tauri/target/release/bundle
            files: |
              appimage/*.AppImage
          - name: linux-arm64
            os: ubuntu-22.04-arm
            args: --bundles appimage
            bundle: src-tauri/target/release/bundle
            files: |
              appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            libasound2-dev libssl-dev file \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.name }}

      # --ignore-scripts: nothing here needs install scripts, and it skips
      # onnxruntime-node's native download (the app uses the web runtime).
      - name: Install npm packages
        run: npm ci --ignore-scripts

      - name: Build
        run: npx tauri build ${{ matrix.args }}
        env:
          # lets linuxdeploy run without FUSE on the runners
          APPIMAGE_EXTRACT_AND_RUN: 1

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p out
          cd "${{ matrix.bundle }}"
          while IFS= read -r pattern; do
            [ -z "$pattern" ] && continue
            for f in $pattern; do
              if [ -e "$f" ]; then cp -v "$f" "$GITHUB_WORKSPACE/out/"; fi
            done
          done <<< "${{ matrix.files }}"
          ls -la "$GITHUB_WORKSPACE/out"
          test -n "$(ls -A "$GITHUB_WORKSPACE/out")"

      - uses: actions/upload-artifact@v4
        with:
          name: User-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: User ${{ github.ref_name }}
          files: installers/*
          body: |
            Installers for User ${{ github.ref_name }}.

            - **Windows**: `*-setup.exe` (or the `.msi`)
            - **macOS** (Apple Silicon + Intel): `*_universal.dmg`. The app isn't notarized, so the first time, right-click the app and choose **Open**.
            - **Linux**: `*.AppImage` (x86_64 or aarch64). Make it executable (`chmod +x`) and run it.

            User talks through Claude Code (the `claude` CLI) or an OpenRouter API key. See the README.
