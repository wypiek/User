<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob: 'sha256-RvSqMMlaYRsHPXaR0Z4vnUQOfMrUuufaTuUKtVDxL08='; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: data:; font-src 'self'; connect-src 'self' https: blob: data:">
  <title>User</title>
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">
    {
      "imports": {
        "three": "/node_modules/three/build/three.module.js",
        "three/addons/": "/node_modules/three/examples/jsm/",
        "@huggingface/transformers": "/node_modules/@huggingface/transformers/dist/transformers.web.js",
        "onnxruntime-web/webgpu": "/node_modules/onnxruntime-web/dist/ort.webgpu.bundle.min.mjs",
        "onnxruntime-common": "/src/ort-common-shim.js"
      }
    }
  </script>
</head>
<body>
  <canvas id="stage"></canvas>

  <div id="caption" aria-live="polite"></div>

  <div id="osd-left"><span id="play">PLAY ▶</span><span id="counter">0:00:00</span></div>
  <div id="osd-right"><span id="clock"></span></div>

  <div id="hud">
    <div id="doing"></div>
    <div id="heard"></div>
    <div id="status">hold [LEFT CTRL] to speak</div>
    <input id="typebox" type="text" autocomplete="off" spellcheck="false" placeholder="type to User... (enter to send, esc to cancel)">
  </div>

  <button id="gear" title="Settings (F1)">⚙</button>

  <div id="settings" hidden>
    <div class="panel">
      <h2>// USER.CFG</h2>
      <fieldset>
        <legend>what powers him</legend>
        <label><input type="radio" name="provider" value="claude-code"> Claude Code <small>(uses the <code>claude</code> CLI you are logged into)</small></label>
        <label><input type="radio" name="provider" value="openrouter"> OpenRouter <small>(API key)</small></label>
      </fieldset>
      <fieldset data-for="claude-code">
        <legend>claude code</legend>
        <label>path to claude <input id="claudePath" type="text" placeholder="claude"></label>
        <label>model <small>(optional, e.g. sonnet / opus)</small> <input id="claudeModel" type="text" placeholder="default"></label>
      </fieldset>
      <fieldset data-for="openrouter">
        <legend>openrouter</legend>
        <label>api key <input id="openrouterKey" type="password" placeholder="sk-or-..."></label>
        <label>model <input id="openrouterModel" type="text" list="models" placeholder="anthropic/claude-sonnet-5.5"></label>
        <datalist id="models"></datalist>
      </fieldset>
      <fieldset>
        <legend>device</legend>
        <label><input id="deviceControl" type="checkbox"> let User open apps and control this device</label>
        <label><input id="confirmCommands" type="checkbox"> ask me before he runs a command <small>(openrouter)</small></label>
      </fieldset>
      <fieldset>
        <legend>sound / speech</legend>
        <label>voice volume <input id="voiceVolume" type="range" min="0" max="1" step="0.05"></label>
        <label>night ambience <input id="ambienceVolume" type="range" min="0" max="1" step="0.05"></label>
        <label>speech model
          <select id="sttModel">
            <option value="onnx-community/whisper-tiny.en">whisper tiny (fastest, ~40 MB)</option>
            <option value="onnx-community/whisper-base.en">whisper base (default, ~80 MB)</option>
            <option value="onnx-community/whisper-small.en">whisper small (best, ~250 MB)</option>
          </select>
        </label>
      </fieldset>
      <div class="row">
        <button id="forget">forget conversation</button>
        <span class="spacer"></span>
        <button id="cancelSettings">cancel</button>
        <button id="saveSettings" class="primary">save</button>
      </div>
      <p class="keys">LEFT CTRL hold = talk · ENTER = type · ESC = stop him · F1 = settings</p>
    </div>
  </div>

  <div id="boot">
    <div class="boot-text">TRACKING<span class="dots"></span></div>
    <div id="boot-detail"></div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
